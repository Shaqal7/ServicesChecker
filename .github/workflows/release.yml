name: Build, Test & Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: src/ServicesChecker.UI/ServicesChecker.UI.csproj
  PUBLISH_DIR: publish

jobs:
  build-test-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ServicesChecker.sln

      - name: Build solution
        run: dotnet build ServicesChecker.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ServicesChecker.sln --configuration Release --no-build --verbosity normal

      - name: Publish application
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:PublishTrimmed=false
          --output ${{ env.PUBLISH_DIR }}

      - name: Generate version tag
        id: version
        run: |
          $date = Get-Date -Format "yyyy.MM.dd"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $tag = "v$date-$sha"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "Generated version: $tag"
        shell: pwsh

      - name: Create ZIP archive
        run: Compress-Archive -Path "${{ env.PUBLISH_DIR }}\*" -DestinationPath "ServicesChecker-win-x64.zip"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ServicesChecker ${{ steps.version.outputs.tag }}
          files: ServicesChecker-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
